<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoW 插件备份恢复工具</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="bar">
      <div class="bar-left">WoW Backup Tool</div>
      <div class="bar-right">© 2026 潘公子大人</div>
    </div>

    <!-- =============================================== -->
    <!-- GLOBAL GAME SELECTOR (STEP 1)                    -->
    <!-- =============================================== -->
    <div class="game-card">
      <div class="game-card-head">
        <div class="label step"><span class="step-num">1</span>当前游戏</div>
        <button id="game-switch" class="btn">切换</button>
      </div>
      <div id="game-name" class="game-name">正在检测...</div>
      <div id="game-path" class="game-path"></div>
      <div id="game-status" class="hint"></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button id="tab-backup" class="tab active">创建备份</button>
      <button id="tab-restore" class="tab">还原备份</button>
    </div>

    <!-- =============================================== -->
    <!-- BACKUP TAB                                       -->
    <!-- =============================================== -->
    <div id="panel-backup" class="panel">

      <div class="block">
        <div class="label step"><span class="step-num">2</span>备份哪些内容</div>
        <div class="checks">
          <label class="check"><input type="checkbox" id="bk-interface" checked /><span class="check-title">Interface</span><span class="check-desc">插件代码、素材和配置，可达数百 MB</span></label>
          <label class="check"><input type="checkbox" id="bk-wtf" checked /><span class="check-title">WTF</span><span class="check-desc">角色按键、宏命令、插件设置、账号信息及显示配置</span></label>
          <label class="check"><input type="checkbox" id="bk-fonts" checked /><span class="check-title">Fonts</span><span class="check-desc">自定义字体文件（多数用户不需要）</span></label>
        </div>
      </div>

      <div class="block">
        <div class="label step"><span class="step-num">3</span>保存到</div>
        <div class="row">
          <input type="text" id="bk-output" placeholder="~/Documents/WoWBackups" />
          <button id="bk-outdir" class="btn">浏览...</button>
        </div>
      </div>

      <div id="bk-progress" class="block hidden progress">
        <div class="track"><div id="bk-fill" class="fill"></div></div>
        <div id="bk-progtext" class="hint mono"></div>
      </div>

      <button id="btn-backup" class="btn-primary">创建备份</button>
    </div>

    <!-- =============================================== -->
    <!-- RESTORE TAB                                      -->
    <!-- =============================================== -->
    <div id="panel-restore" class="panel hidden">

      <div class="block">
        <div class="label step"><span class="step-num">2</span>还原哪些内容</div>
        <div class="checks">
          <label class="check"><input type="checkbox" id="rs-interface" checked /><span class="check-title">Interface</span><span class="check-desc">插件代码、素材和配置，可达数百 MB</span></label>
          <label class="check"><input type="checkbox" id="rs-wtf" checked /><span class="check-title">WTF</span><span class="check-desc">角色按键、宏命令、插件设置、账号信息及显示配置</span></label>
          <label class="check"><input type="checkbox" id="rs-fonts" checked /><span class="check-title">Fonts</span><span class="check-desc">自定义字体文件（多数用户不需要）</span></label>
          <label class="check subtle"><input type="checkbox" id="rs-keepcfg" checked /><span class="check-title">保留当前显示配置</span><span class="check-desc">还原后保留分辨率、窗口模式、画质等本机显示设置</span></label>
        </div>
      </div>

      <div class="block">
        <div class="label step"><span class="step-num">3</span>从哪个备份文件还原</div>
        <div class="row">
          <input type="text" id="rs-file" placeholder="点击右侧选择 .zip 备份文件" readonly />
          <button id="rs-choose" class="btn">选择文件...</button>
        </div>
        <div id="rs-fileinfo" class="hint hidden"></div>
      </div>

      <div id="rs-progress" class="block hidden progress">
        <div class="track"><div id="rs-fill" class="fill"></div></div>
        <div id="rs-progtext" class="hint mono"></div>
      </div>

      <button id="btn-restore" class="btn-primary" disabled>选择备份文件后开始还原</button>
    </div>

    <!-- Status -->
    <div id="status-bar" class="status">就绪</div>
  </div>

  <!-- =============================================== -->
  <!-- GAME PICKER MODAL                                -->
  <!-- =============================================== -->
  <div id="game-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="game-modal-title">
      <div class="modal-head">
        <div id="game-modal-title" class="modal-title">选择 WoW 版本</div>
        <button id="game-modal-close" class="modal-close" title="关闭">✕</button>
      </div>
      <div id="game-list" class="game-list"></div>
      <div class="modal-actions">
        <button id="game-refresh" class="btn">重新检测</button>
        <button id="game-browse" class="btn">浏览其他目录...</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
