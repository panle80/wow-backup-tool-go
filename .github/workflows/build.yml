name: Build
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Prepare icon
        run: |
          New-Item -ItemType Directory -Force -Path build
          Copy-Item huifubeifen.png build/appicon.png -Force

      - name: Build Windows
        run: wails build -platform windows/amd64 -clean

      # wails build has generated frontend/wailsjs and frontend/dist by now,
      # so the Go package (which embeds dist) can be vetted and tested.
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      # --- Windows code signing via SignPath Foundation (free for OSS) ---
      # Enable signing by configuring these repository variables:
      #   SIGNPATH_ENABLED=true
      #   SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      #   SIGNPATH_SIGNING_POLICY_SLUG, SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
      # and the SIGNPATH_API_TOKEN secret. Until then, releases stay unsigned
      # and everything works as before.
      - name: Upload unsigned artifact for signing
        id: upload-unsigned
        if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: WoWBackupTool-Windows-unsigned
          path: build/bin/WoWBackupTool.exe

      - name: Submit SignPath signing request
        id: signpath
        if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed

      - name: Upload signed Windows artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: WoWBackupTool-Windows
          path: signed/WoWBackupTool.exe

      - name: Upload Windows artifact
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: WoWBackupTool-Windows
          path: build/bin/WoWBackupTool.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Prepare icon
        run: |
          mkdir -p build
          cp huifubeifen.png build/appicon.png

      - name: Build macOS (Apple Silicon arm64)
        run: wails build -platform darwin/arm64 -clean

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoWBackupTool-macOS-AppleSilicon
          path: build/bin/*.app

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          VERSION=${{ github.ref_name }}
          # Windows: zip the exe
          cd artifacts/WoWBackupTool-Windows
          zip ../../WoWBackupTool-${VERSION}-Windows-x64.zip WoWBackupTool.exe
          cd ../..
          # macOS: zip the .app bundle
          cd artifacts/WoWBackupTool-macOS-AppleSilicon
          zip -r ../../WoWBackupTool-${VERSION}-macOS-arm64.zip .
          cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WoWBackupTool-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
